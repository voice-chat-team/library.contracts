syntax = "proto3";

package messages.v1;

option go_package = "github.com/voice-chat-team/contracts/gen/go/messages/v1;messages_v1";

import "common.proto";

service MessageService {
  rpc AddReaction(AddReactionRequest) returns (AddReactionResponse);
  rpc RemoveReaction(RemoveReactionRequest) returns (RemoveReactionResponse);
  rpc GetReactionUsers(GetReactionUsersRequest) returns (GetReactionUsersResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetChannelMessages(GetChannelMessagesRequest) returns (GetChannelMessagesResponse);
  rpc UpdateMessage(UpdateMessageRequest) returns (UpdateMessageResponse);
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc GetAttachmentDownloadUrl(GetAttachmentDownloadUrlRequest) returns (GetAttachmentDownloadUrlResponse);
}

message Attachment {
  string file_id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string url = 5;
}

message Message {
  string id = 1;
  string channel_id = 2;
  string guild_id = 3;
  string sender_id = 4;
  string content = 5;
  bool is_edited = 6;
  bool is_deleted = 7;
  string created_at = 8;
  string updated_at = 9;
  repeated Attachment attachments = 10;
  repeated MessageReaction reactions = 11;
  int32 reactions_version = 12;
}

message SendMessageRequest {
  string channel_id = 1;
  string guild_id = 2;
  string sender_id = 3;
  string content = 4;
  repeated string attachment_file_ids = 5;
}

message SendMessageResponse {
  Message message = 1;
}

message GetChannelMessagesRequest {
  string channel_id = 1;
  string guild_id = 2;
  optional string before_message_id = 3;
  int32 limit = 4;
  string user_id = 5;
}

message GetChannelMessagesResponse {
  repeated Message messages = 1;
}

message UpdateMessageRequest {
  string message_id = 1;
  string guild_id = 2;
  string user_id = 3;
  string content = 4;
}

message UpdateMessageResponse {
  Message message = 1;
}

message DeleteMessageRequest {
  string message_id = 1;
  string guild_id = 2;
  string user_id = 3;
}

message DeleteMessageResponse {
  bool success = 1;
}

message GetAttachmentDownloadUrlRequest {
  string file_id = 1;
  string user_id = 2;
}

message GetAttachmentDownloadUrlResponse {
  string url = 1;
  string expires_at = 2;
}

message MessageReaction {
  string emoji = 1;
  int32 count = 2;
  bool reacted = 3;
}
message AddReactionRequest {
  string guild_id = 1;
  string message_id = 2;
  string emoji = 3;
  string user_id = 4;
}
message RemoveReactionRequest {
  string guild_id = 1;
  string message_id = 2;
  string emoji = 3;
  string user_id = 4;
}
message AddReactionResponse {
  string message_id = 1;
  string emoji = 2;
  int32 count = 3;
  bool reacted = 4;
  int32 version = 5;
}
message GetReactionUsersRequest {
  string guild_id = 1;
  string message_id = 2;
  string emoji = 3;
  string user_id = 4;
  optional string cursor = 5;
  int32 limit = 6;
}
message ReactionUser {
  string user_id = 1;
  common.v1.UserProfile user = 2;
  string emoji = 3;
  string created_at = 4;
}
message GetReactionUsersResponse {
  repeated ReactionUser users = 1;
  string next_cursor = 2;
}

message RemoveReactionResponse {
  string message_id = 1;
  string emoji = 2;
  int32 count = 3;
  bool reacted = 4;
  int32 version = 5;
}
