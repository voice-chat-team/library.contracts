syntax = "proto3";

package guilds.v1;

option go_package = "github.com/voice-chat-team/contracts/gen/go/guilds/v1;guilds_v1";

import "common.proto";

service GuildService {
  rpc UpdateGuild(UpdateGuildRequest) returns (UpdateGuildResponse);
  rpc KickMember(KickMemberRequest) returns (KickMemberResponse);

  rpc GetGuildRoles(GetGuildRolesRequest) returns (GetGuildRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  rpc ReorderRoles(ReorderRolesRequest) returns (ReorderRolesResponse);
  rpc AddRoleMembers(AddRoleMembersRequest) returns (AddRoleMembersResponse);
  rpc RemoveRoleMembers(RemoveRoleMembersRequest) returns (RemoveRoleMembersResponse);

  rpc GetGuildById(GetGuildByIdRequest) returns (GetGuildByIdResponse);
  rpc GetUserGuilds(GetUserGuildsRequest) returns (GetUserGuildsResponse);
  rpc GetGuildMembers(GetGuildMembersRequest) returns (GetGuildMembersResponse);
  rpc GetMemberById(GetMemberByIdRequest) returns (GetMemberByIdResponse);

  rpc CreateGuild(CreateGuildRequest) returns (CreateGuildResponse);
  rpc RemoveGuild(RemoveGuildRequest) returns (RemoveGuildResponse);
  rpc DeleteGuild(DeleteGuildRequest) returns (DeleteGuildResponse);

  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  rpc GetGuildChannels(GetGuildChannelsRequest) returns (GetGuildChannelsResponse);
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);

  rpc JoinUserToGuild(JoinUserToGuildRequest) returns (JoinUserToGuildResponse);
  rpc LeaveUserFromGuild(LeaveUserFromGuildRequest) returns (LeaveUserFromGuildResponse);
}

message Guild {
  string id = 1;
  string name = 2;
  optional string description = 3;
  bool is_public = 4;
  string created_at = 5;
  string updated_at = 6;
}

message GuildMember {
  string id = 1;
  string user_id = 2;
  string guild_id = 3;
  bool is_guild_owner = 4;
  bool is_banned = 5;
  string joined_at = 6;
  optional string banned_at = 7;
  common.v1.UserProfile user = 8;
  repeated string role_ids = 9;
  int64 permissions = 10;
}

message Channel {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  ChannelType type = 4;
  bool is_private = 5;
  string created_at = 6;
  string updated_at = 7;
}

enum ChannelType {
  TEXT = 0;
  VOICE = 1;
}

message JoinUserToGuildRequest {
  string user_id = 1;
  string guild_id = 2;
}

message JoinUserToGuildResponse {
   GuildMember member_info = 1;
}

message LeaveUserFromGuildRequest {
  string user_id = 1;
  string guild_id = 2;
}

message LeaveUserFromGuildResponse {
   GuildMember member_info = 1;
}

message GetGuildByIdRequest {
  string guild_id = 1;
}

message GetGuildByIdResponse {
  Guild guild = 1;
}

message GetGuildMembersRequest {
  string guild_id = 1;
  optional string user_id = 2;
}

message GetGuildMembersResponse {
  repeated GuildMember members = 1;
}

message CreateGuildRequest {
  string name = 1;
  optional string description = 2;
  bool is_public = 3;
  string user_id = 4;
}

message CreateGuildResponse {
  Guild guild = 1;
}

message GetUserGuildsRequest {
  string user_id = 1;
}

message GetMemberByIdResponse {
  GuildMember member_info = 1;
}

message GetMemberByIdRequest {
  string user_id = 1;
  string guild_id = 2;
}

message GetUserGuildsResponse {
  repeated Guild guilds = 1;
}

message RemoveGuildRequest {
  string guild_id = 1;
  string user_id = 2;
}

message RemoveGuildResponse {
  bool success = 1;
}

message DeleteGuildRequest {
  string guild_id = 1;
  string user_id = 2;
}

message DeleteGuildResponse {
  bool success = 1;
}

message CreateChannelRequest {
  string guild_id = 1;
  string name = 2;
  ChannelType type = 3;
  bool is_private = 4;
  string user_id = 5;
}

message CreateChannelResponse {
  Channel channel = 1;
}

message GetGuildChannelsRequest {
  string guild_id = 1;
}

message GetGuildChannelsResponse {
  repeated Channel channels = 1;
}

message UpdateChannelRequest {
  string channel_id = 1;
  optional string name = 2;
  optional bool is_private = 3;
  string user_id = 4;
  string guild_id = 5;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1;
  string guild_id = 2;
  string user_id = 3;
}

message DeleteChannelResponse {
  bool success = 1;
}

// ---------- Roles ----------

message Role {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string color = 4;
  int32 position = 5;
  int64 permissions = 6;
  bool is_default = 7;
  string created_at = 8;
  string updated_at = 9;
}

message GetGuildRolesRequest {
  string guild_id = 1;
  string user_id = 2;
}
message GetGuildRolesResponse {
  repeated Role roles = 1;
}

message CreateRoleRequest {
  string guild_id = 1;
  string user_id = 2;
  string name = 3;
  optional string color = 4;
  optional int64 permissions = 5;
}
message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string guild_id = 1;
  string user_id = 2;
  string role_id = 3;
  optional string name = 4;
  optional string color = 5;
  optional int64 permissions = 6;
}
message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string guild_id = 1;
  string user_id = 2;
  string role_id = 3;
}
message DeleteRoleResponse {
  bool success = 1;
}

message ReorderRolesRequest {
  string guild_id = 1;
  string user_id = 2;
  repeated string role_ids = 3;
}
message ReorderRolesResponse {
  repeated Role roles = 1;
}

message AddRoleMembersRequest {
  string guild_id = 1;
  string user_id = 2;
  string role_id = 3;
  repeated string target_user_ids = 4;
}
message AddRoleMembersResponse {
  repeated GuildMember members = 1;
}

message RemoveRoleMembersRequest {
  string guild_id = 1;
  string user_id = 2;
  string role_id = 3;
  repeated string target_user_ids = 4;
}
message RemoveRoleMembersResponse {
  repeated GuildMember members = 1;
}

// ---------- Moderation / settings ----------

message KickMemberRequest {
  string guild_id = 1;
  string user_id = 2;
  string target_user_id = 3;
}
message KickMemberResponse {
  bool success = 1;
}

message UpdateGuildRequest {
  string guild_id = 1;
  string user_id = 2;
  optional string name = 3;
  optional string description = 4;
}
message UpdateGuildResponse {
  Guild guild = 1;
}
