syntax = "proto3";

package boards.v1;

option go_package = "github.com/voice-chat-team/contracts/gen/go/boards/v1;boards_v1";

service BoardService {
  rpc GetGuildBoards(GetGuildBoardsRequest) returns (GetGuildBoardsResponse);
  rpc CreateBoard(CreateBoardRequest) returns (CreateBoardResponse);
  rpc RenameBoard(RenameBoardRequest) returns (RenameBoardResponse);
  rpc DeleteBoard(DeleteBoardRequest) returns (DeleteBoardResponse);
  rpc GetBoardScene(GetBoardSceneRequest) returns (GetBoardSceneResponse);
  rpc ApplyBoardOps(ApplyBoardOpsRequest) returns (ApplyBoardOpsResponse);
  rpc GetBoardSubscriptionToken(GetBoardSubscriptionTokenRequest) returns (GetBoardSubscriptionTokenResponse);
}

message Board {
  string id = 1;
  string guild_id = 2;
  string name = 3;
  string creator_id = 4;
  string created_at = 5;
}

message GetGuildBoardsRequest {
  string guild_id = 1;
  string user_id = 2;
}

message GetGuildBoardsResponse {
  repeated Board boards = 1;
}

message CreateBoardRequest {
  string guild_id = 1;
  string user_id = 2;
  string name = 3;
}

message CreateBoardResponse {
  Board board = 1;
}

message RenameBoardRequest {
  string board_id = 1;
  string guild_id = 2;
  string user_id = 3;
  string name = 4;
}

message RenameBoardResponse {
  Board board = 1;
}

message DeleteBoardRequest {
  string board_id = 1;
  string guild_id = 2;
  string user_id = 3;
}

message DeleteBoardResponse {
  bool success = 1;
}

message GetBoardSceneRequest {
  string board_id = 1;
  string guild_id = 2;
  string user_id = 3;
}

// Элементы Excalidraw передаются JSON-строкой: сервису нужны из них только
// id, version, versionNonce и isDeleted, остальное он хранит как есть.
message GetBoardSceneResponse {
  string elements_json = 1;
  string app_state_json = 2;
  int32 seq = 3;
}

message ApplyBoardOpsRequest {
  string board_id = 1;
  string guild_id = 2;
  string user_id = 3;
  string client_id = 4;
  string elements_json = 5;
  optional string app_state_json = 6;
}

message ApplyBoardOpsResponse {
  int32 seq = 1;
  repeated string accepted_ids = 2;
}

message GetBoardSubscriptionTokenRequest {
  string board_id = 1;
  string guild_id = 2;
  string user_id = 3;
}

message GetBoardSubscriptionTokenResponse {
  string board_token = 1;
  string presence_token = 2;
}
